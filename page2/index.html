<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verification - Mutual Funds vs FD</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;overflow-x:hidden;background:#f5f5f5}
        body{font-family:Arial,sans-serif;padding:0}
        .container{max-width:100%;width:100%;background:white;padding:25px 15px;margin:0 auto}
        .green-btn{display:inline-block;padding:14px 35px;background:#4CAF50;border:none;color:white;font-size:16px;border-radius:4px;cursor:pointer;text-decoration:none}
        .ad-space{background:#f9f9f9;border:1px dashed #ddd;padding:15px 10px;margin:20px 0;min-height:100px;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;border-radius:5px}
        .wait-text{font-size:16px;color:#4CAF50;margin:20px 0;text-align:center}
        .content-section{text-align:left;margin:25px 0;line-height:1.8;word-wrap:break-word}
        .content-section h2{color:#2E7D32;font-size:22px;margin-bottom:15px}
        .content-section h3{color:#333;font-size:18px;margin:20px 0 10px}
        .content-section ul{margin:10px 0 20px 15px}
        .content-section li{margin:8px 0;color:#444;font-size:14px}
        .content-section p{margin:15px 0;color:#444;font-size:14px}
        .content-section img{max-width:100%;height:auto;border-radius:8px;margin:15px 0}
        .highlight-box{background:#E8F5E9;padding:15px;border-radius:8px;margin:20px 0;border-left:4px solid #4CAF50}
        .button-section{text-align:center;padding:15px 0}
        .perma-hide{display:none!important}
    </style>
</head>
<body>

<div class="container">

    <div id="verifySection">
        <div class="button-section">
            <div class="ad-space">📢 Banner Ad - Paste Code Here</div>
            <button class="green-btn" id="verifyBtn" onclick="showWait()">click here to verify</button>
            <div class="ad-space">📢 Banner Ad - Paste Code Here</div>
        </div>
        <div class="content-section" id="articleTop"></div>
    </div>

    <div id="waitSection" style="display:none;">
        <div class="button-section">
            <div class="ad-space">📢 Banner Ad - Paste Code Here</div>
            <p class="wait-text" id="waitText">please wait</p>
            <button class="green-btn" id="continueBtn" style="display:none;" onclick="goToPage3()">continue</button>
            <div class="ad-space">📢 Banner Ad - Paste Code Here</div>
        </div>
        <div class="content-section" id="articleBottom"></div>
    </div>

</div>

<script>
history.pushState(null, '', location.href);
window.onpopstate = function(){ history.go(1); };

if(sessionStorage.getItem('page1Done') !== 'true'){
    window.location.replace('../page1/');
}
if(sessionStorage.getItem('page2Done')){
    window.location.replace('../page3/');
}
if(localStorage.getItem('page2VerifyClicked')){
    document.getElementById('verifyBtn').classList.add('perma-hide');
    document.getElementById('waitSection').style.display = 'block';
    if(localStorage.getItem('page2ContinueShow')){
        document.getElementById('waitText').style.display = 'none';
        document.getElementById('continueBtn').style.display = 'inline-block';
    }
}

var article = `
    <h2>Why Mutual Funds Are Gaining Popularity in India</h2>
    <p>The Indian mutual fund industry has witnessed unprecedented growth in recent years. According to AMFI data, the total Assets Under Management (AUM) crossed ₹50 Lakh Crore in 2024. This massive growth reflects a fundamental shift in how Indians think about investing.</p>
    <p>Gone are the days when Fixed Deposits and gold were the only investment options. Today's investors are more aware, tech-savvy, and willing to explore market-linked products for better returns.</p>
    <img src="https://images.unsplash.com/photo-1554224155-6726b3ff858f?w=600" alt="Investment Growth">
    <h3>Key Drivers of Mutual Fund Growth</h3>
    <ul><li><strong>Digital Platforms:</strong> Apps like Groww, Zerodha, and Paytm Money made investing easy</li><li><strong>Financial Literacy:</strong> Social media and YouTube spreading awareness</li><li><strong>SIP Culture:</strong> Start with just ₹500/month</li><li><strong>SEBI Regulations:</strong> Increased trust and transparency</li><li><strong>Low Interest Rates:</strong> Falling FD rates push investors to seek better alternatives</li></ul>
    <div class="highlight-box"><h3>📈 Did You Know?</h3><p>India added over 2 Crore new mutual fund investors in 2024. Total SIP accounts exceed 7 Crore!</p></div>
    <h3>Common Investment Mistakes to Avoid</h3>
    <ul><li><strong>Chasing Past Returns:</strong> Last year's top performer may not repeat</li><li><strong>Ignoring Risk:</strong> Equity funds can fall 20-30% in bad years</li><li><strong>Stopping SIPs in Market Falls:</strong> Best time to accumulate more units</li><li><strong>Not Diversifying:</strong> Don't put all money in one fund</li></ul>
    <h3>How to Select the Right Mutual Fund</h3>
    <ul><li><strong>Define Your Goal:</strong> Retirement, education, house, wealth creation</li><li><strong>Check Time Horizon:</strong> Equity 5+ years, Debt 1-3 years</li><li><strong>Compare Expense Ratio:</strong> Lower ratio = more returns</li><li><strong>Analyze Fund Manager:</strong> Check experience and track record</li></ul>
    <h3>SIP: The Game Changer</h3>
    <p>Systematic Investment Plans revolutionized mutual fund investing. Starting with ₹500/month, anyone can invest. SIPs bring discipline and rupee cost averaging.</p>
    <h3>Tax Benefits of Mutual Funds</h3>
    <p>ELSS offers 80C deduction up to ₹1.5 lakh. LTCG up to ₹1 lakh tax-free. Debt funds get indexation benefit.</p>
    <p>FDs still relevant for emergency funds and senior citizens needing regular income.</p>
`;

document.getElementById('articleTop').innerHTML = article;
document.getElementById('articleBottom').innerHTML = article;

if(!localStorage.getItem('page2VerifyClicked')){
    setTimeout(function(){
        document.getElementById('verifyBtn').style.display = 'inline-block';
    }, 4000);
}

function showWait(){
    localStorage.setItem('page2VerifyClicked', 'true');
    document.getElementById('verifyBtn').classList.add('perma-hide');
    document.getElementById('waitSection').style.display = 'block';
    document.getElementById('waitSection').scrollIntoView({behavior:'smooth'});
    setTimeout(function(){
        document.getElementById('waitText').style.display = 'none';
        document.getElementById('continueBtn').style.display = 'inline-block';
        localStorage.setItem('page2ContinueShow', 'true');
    }, 10000);
}

function goToPage3(){
    sessionStorage.setItem('page2Done', 'true');
    window.location.replace('../page3/');
}
</script>

</body>
</html>
